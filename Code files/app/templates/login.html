{% extends "base.html" %}{% block title %}Login | PocketSmart AI{% endblock %}
{% block content %}<section class="auth-section"><div class="auth-card"><div class="center"><div class="auth-logo">PocketSmart<span>AI</span></div><h1>Welcome Back</h1><p>Sign in to access your saved plans.</p></div>
<form id="login-form" class="form"><label>Email<input type="email" name="email" required placeholder="you@example.com"></label><label>Password<input type="password" name="password" required placeholder="Your password"></label><div id="form-message" class="form-message"></div><button class="btn btn-primary full">Sign In</button></form>
<p class="auth-switch">Don't have an account? <a href="/register">Create one</a></p></div></section>{% endblock %}
{% block scripts %}<script>window.PocketSmart.initLogin();</script>{% endblock %}
