{% extends "base.html" %}{% block title %}Create Account | PocketSmart AI{% endblock %}
{% block content %}<section class="auth-section"><div class="auth-card"><div class="center"><div class="auth-logo">PocketSmart<span>AI</span></div><h1>Create Your Account</h1><p>Start building personalized budget plans.</p></div>
<form id="register-form" class="form"><label>Name<input name="name" required minlength="2" placeholder="Your name"></label><label>Email<input type="email" name="email" required placeholder="you@example.com"></label><label>Password<input type="password" name="password" required minlength="8" placeholder="At least 8 characters"></label><div id="form-message" class="form-message"></div><button class="btn btn-primary full">Create Account</button></form>
<p class="auth-switch">Already have an account? <a href="/login">Sign in</a></p></div></section>{% endblock %}
{% block scripts %}<script>window.PocketSmart.initRegister();</script>{% endblock %}
